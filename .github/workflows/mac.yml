name: Build macOS Sonoma ISO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS Sonoma Installer via installinstallmacos.py
        run: |
          pip3 install --break-system-packages xattr
          curl -sL https://raw.githubusercontent.com/munki/macadmin-scripts/main/installinstallmacos.py -o installinstallmacos.py
          python3 installinstallmacos.py --workdir . --ignore-cache --minimum-os-version 14 --maximum-os-version 14.99
          # 找到生成的 dmg
          DMG=$(find . -name "Install_macOS_*.dmg" -maxdepth 2 | head -1)
          echo "Found DMG: $DMG"
          # 挂载 dmg
          hdiutil attach "$DMG"
          # 找到 .app
          APP_PATH=$(find /Volumes -name "Install macOS*.app" -maxdepth 2 2>/dev/null | head -1)
          echo "Found APP: $APP_PATH"
          # 复制到 /Applications
          cp -R "$APP_PATH" /Applications/
          # 验证
          ls -la /Applications/ | grep "Install macOS"
          # 卸载 dmg
          VOLUME=$(dirname "$APP_PATH")
          hdiutil detach "$VOLUME"

      - name: Create 18GB DMG
        run: |
          hdiutil create -o install.dmg -size 18G -layout GPTSPUD -fs HFS+J
          hdiutil attach install.dmg

      - name: Create bootable install media
        run: |
          sudo /Applications/Install\ macOS\ Sonoma.app/Contents/Resources/createinstallmedia --volume /Volumes/Untitled --nointeraction

      - name: Create ISO from DMG
        run: |
          hdiutil detach "/Volumes/Install macOS Sonoma" || true
          sleep 2
          hdiutil convert install.dmg -format UDTO -o macos_sonoma
          mv macos_sonoma.cdr macos_sonoma.iso

      - name: Create Release and Upload ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create sonoma-latest \
            --title "Sonoma-ISO" \
            --prerelease \
            --notes "macOS Sonoma bootable ISO for VirtualBox/VMware (Intel x86_64)" \
            macos_sonoma.iso

      - name: Output ISO download link
        run: |
          echo "========================================"
          echo "✅ macOS Sonoma ISO 下载直链："
          echo "https://github.com/${{ github.repository }}/releases/download/sonoma-latest/macos_sonoma.iso"
          echo "========================================"
          echo "复制上面的链接，粘贴到XDown多线程下载"
          echo "保存路径建议：D:\\iso\\macos_sonoma.iso"
          echo "========================================"
