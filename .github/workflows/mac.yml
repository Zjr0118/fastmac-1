name: Build macOS Sonoma ISO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /Applications/Xcode.app || true
          sudo rm -rf /Library/Developer/CommandLineTools || true
          sudo rm -rf /Applications/GarageBand.app /Applications/iMovie.app /Applications/Keynote.app /Applications/Pages.app /Applications/Numbers.app || true
          brew uninstall --force --ignore-dependencies $(brew list) 2>/dev/null || true
          brew cleanup --prune=all || true
          sudo rm -rf /opt/homebrew/lib/node_modules /usr/local/lib/node_modules || true
          rm -rf ~/Library/Caches/* /tmp/* || true
          sudo rm -rf /private/var/log/* || true
          df -h /
      - name: Download macOS Sonoma Installer
        run: |
          # GitHub runner 直连 Apple CDN 会被 403，必须走 softwareupdate 通道
          # 目录中 Sonoma 最新可用版本为 14.8.9 (23J631)，14.8.4 已被 Apple 下架
          softwareupdate --fetch-full-installer --full-installer-version 14.8.9
          ls -d /Applications/Install\ macOS*.app
      - name: Create 15.5GB DMG
        run: |
          hdiutil create -o install.dmg -size 15.5G -layout GPTSPUD -fs HFS+J
          hdiutil attach install.dmg
      - name: Create bootable install media
        run: |
          # 动态定位安装器，避免硬编码路径
          INSTALLER_APP=$(ls -d /Applications/Install\ macOS*.app | head -1)
          echo "Using installer: $INSTALLER_APP"
          sudo "$INSTALLER_APP/Contents/Resources/createinstallmedia" --volume /Volumes/Untitled --nointeraction
      - name: Create ISO from DMG
        run: |
          sudo rm -rf /Applications/Install\ macOS*.app
          rm -rf /tmp/* ~/Library/Caches/* || true
          df -h /
          hdiutil detach "/Volumes/Install macOS Sonoma" || true
          sleep 2
          hdiutil convert install.dmg -format UDTO -o macos_sonoma
          mv macos_sonoma.cdr macos_sonoma.iso
          ls -lh macos_sonoma.iso
      - name: Split ISO into parts
        run: |
          # 删除 DMG 释放空间（约14GB）
          rm -f install.dmg
          # 再次清理
          rm -rf /tmp/* ~/Library/Caches/* || true
          df -h /
          # 生成校验和
          md5 macos_sonoma.iso > md5.txt
          # 分卷（1.9GB一个，小于GitHub 2GB限制）
          split -b 1900m macos_sonoma.iso macos_sonoma.iso.part-
          # 分卷完成后删除原始 ISO，只保留分卷
          rm -f macos_sonoma.iso
          ls -lh macos_sonoma.iso.part-*
          df -h /
      # ===== OpenCore 引导盘（新增） =====
      - name: Download OpenCore bootloader
        run: |
          # 下载专为虚拟机(KVM/QEMU/Proxmox/VMware)预配置的 OpenCore 引导 ISO
          curl -L -o OpenCore.iso.gz https://github.com/thenickdude/KVM-Opencore/releases/download/v21/OpenCore-v21.iso.gz
          gunzip -f OpenCore.iso.gz
          ls -lh OpenCore.iso
          md5 OpenCore.iso >> md5.txt
      - name: Create release notes file
        run: |
          cat > release_notes.md << 'EOF'
          macOS Sonoma bootable ISO for VirtualBox/VMware (Intel x86_64) + OpenCore bootloader

          ## Files
          - macos_sonoma.iso.part-* : macOS Sonoma 安装镜像（分卷）
          - OpenCore.iso            : OpenCore 引导盘（虚拟机引导用，KVM-OpenCore v21）

          ## Windows merge
          Download all part files, then run in CMD:
          copy /b macos_sonoma.iso.part-aa + macos_sonoma.iso.part-ab + macos_sonoma.iso.part-ac + macos_sonoma.iso.part-ad + macos_sonoma.iso.part-ae + macos_sonoma.iso.part-af + macos_sonoma.iso.part-ag + macos_sonoma.iso.part-ah macos_sonoma.iso

          ## Linux/macOS merge
          cat macos_sonoma.iso.part-* > macos_sonoma.iso

          ## How to boot in VM (Proxmox/QEMU example)
          1. Upload both ISOs: macos_sonoma.iso and OpenCore.iso
          2. VM settings: BIOS=OVMF(UEFI), Machine=q35
          3. Mount two CD drives: 1st = OpenCore.iso (bootloader), 2nd = macos_sonoma.iso (installer)
          4. Boot into OpenCore menu, select macOS installer disk
          EOF
      - name: Create Release and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete sonoma-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create sonoma-latest --title "Sonoma-ISO + OpenCore" --prerelease --notes-file release_notes.md macos_sonoma.iso.part-* OpenCore.iso md5.txt
      - name: Output download link
        run: |
          echo "Download page: https://github.com/${{ github.repository }}/releases/tag/sonoma-latest"
          echo "Windows merge: copy /b macos_sonoma.iso.part-* macos_sonoma.iso"
