name: Build macOS Sonoma 14.8.4 ISO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS Sonoma 14.8.4 Installer
        run: |
          softwareupdate --fetch-full-installer --full-installer-version 14.8.4

      - name: Create 18GB DMG
        run: |
          hdiutil create -o install.dmg -size 18G -layout GPTSPUD -fs HFS+J
          hdiutil attach install.dmg

      - name: Create bootable install media
        run: |
          sudo /Applications/Install\ macOS\ Sonoma.app/Contents/Resources/createinstallmedia --volume /Volumes/Untitled --nointeraction

      - name: Create hybrid ISO
        run: |
          hdiutil makehybrid -o macos_sonoma_1484.iso /Volumes/Install\ macOS\ Sonoma -hfs -joliet -iso
          hdiutil detach /Volumes/Install\ macOS\ Sonoma

      - name: Create Release and Upload ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create sonoma-1484 \
            --title "Sonoma-14.8.4-ISO" \
            --prerelease \
            --notes "macOS Sonoma 14.8.4 bootable ISO for VirtualBox/VMware (Intel x86_64)" \
            macos_sonoma_1484.iso

      - name: Output ISO download link
        run: |
          echo "========================================"
          echo "✅ macOS Sonoma 14.8.4 ISO 下载直链："
          echo "https://github.com/${{ github.repository }}/releases/download/sonoma-1484/macos_sonoma_1484.iso"
          echo "========================================"
          echo "复制上面的链接，粘贴到XDown多线程下载"
          echo "保存路径建议：D:\\iso\\macos_sonoma_1484.iso"
          echo "========================================"
