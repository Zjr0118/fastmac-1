name: Build macOS Sonoma ISO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h /
          # 删除 Xcode（约15GB，我们不需要编译）
          sudo rm -rf /Applications/Xcode.app || true
          # 删除 CommandLineTools（约3GB）
          sudo rm -rf /Library/Developer/CommandLineTools || true
          # 清理 brew 缓存
          brew cleanup --prune=all || true
          # 清理用户缓存
          rm -rf ~/Library/Caches/* || true
          rm -rf /tmp/* || true
          echo "After cleanup:"
          df -h /

      - name: Download macOS Sonoma Installer (latest 14.x)
        run: |
          softwareupdate --fetch-full-installer

      - name: Create 16GB DMG
        run: |
          hdiutil create -o install.dmg -size 16G -layout GPTSPUD -fs HFS+J
          hdiutil attach install.dmg

      - name: Create bootable install media
        run: |
          sudo /Applications/Install\ macOS\ Sonoma.app/Contents/Resources/createinstallmedia --volume /Volumes/Untitled --nointeraction

      - name: Prepare DMG for upload
        run: |
          # 卸载卷
          hdiutil detach "/Volumes/Install macOS Sonoma" || true
          sleep 2
          # 重命名 DMG
          mv install.dmg macos_sonoma.dmg
          ls -lh macos_sonoma.dmg
          df -h /

      - name: Create Release and Upload DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create sonoma-latest \
            --title "Sonoma-ISO" \
            --prerelease \
            --notes "macOS Sonoma bootable DMG for VirtualBox/VMware.

## 如何使用（Windows 用户）

1. 下载 macos_sonoma.dmg
2. 下载 dmg2img 工具：http://vu1tur.eu.org/tools/dmg2img-1.6.7-win32.zip
3. 解压后运行：
   dmg2img.exe macos_sonoma.dmg macos_sonoma.iso
4. 在 VirtualBox 中使用生成的 macos_sonoma.iso 作为光盘启动" \
            macos_sonoma.dmg

      - name: Output DMG download link
        run: |
          echo "========================================"
          echo "✅ macOS Sonoma DMG 下载直链："
          echo "https://github.com/${{ github.repository }}/releases/download/sonoma-latest/macos_sonoma.dmg"
          echo "========================================"
          echo "下载后用 dmg2img 转成 ISO："
          echo "dmg2img.exe macos_sonoma.dmg macos_sonoma.iso"
          echo "========================================"
