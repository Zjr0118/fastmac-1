name: debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: macos-14
    steps:
      - name: Test download methods
        run: |
          URL="https://swcdn.apple.com/content/downloads/54/28/047-48595-A_R091M3YM05/clkilvw19hq1zy5j5jz2wnf4re6b3sksfd/InstallAssistant.pkg"
          echo "== 1. curl default =="
          curl -s -r 0-1048575 -o /dev/null -w "HTTP:%{http_code}\n" "$URL" || echo "fail"
          echo "== 2. curl -A InstallAssistant =="
          curl -s -A "InstallAssistant" -r 0-1048575 -o /dev/null -w "HTTP:%{http_code}\n" "$URL" || echo "fail"
          echo "== 3. curl --http1.1 =="
          curl -s --http1.1 -H "Accept: */*" -r 0-1048575 -o /dev/null -w "HTTP:%{http_code}\n" "$URL" || echo "fail"
          echo "== 4. wget =="
          wget --max-redirect=3 -q -O /dev/null --server-response "$URL" 2>&1 | grep -E "HTTP/|Content-Length" | head -4
          echo "== 5. python urllib =="
          python3 -c "import urllib.request; req=urllib.request.Request('$URL', headers={'Range':'bytes=0-1048575'}); r=urllib.request.urlopen(req, timeout=30); print('python HTTP:', r.status, 'read:', len(r.read(1024)))" || echo "python fail"
          echo "== 6. curl -A macOS UA =="
          curl -s -A "Mac OS X" -r 0-1048575 -o /dev/null -w "HTTP:%{http_code}\n" "$URL" || echo "fail"
          echo "== 7. curl with Referer =="
          curl -s -H "Referer: https://mrmacintosh.com/" -r 0-1048575 -o /dev/null -w "HTTP:%{http_code}\n" "$URL" || echo "fail"
          echo "== 8. softwareupdate list =="
          softwareupdate --list-full-installers 2>&1 | head -30 || softwareupdate --list-all-full-installers 2>&1 | head -30
