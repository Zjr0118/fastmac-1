name: Build RockRidge ISO and verify
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /Applications/Xcode.app || true
          sudo rm -rf /Library/Developer/CommandLineTools || true
          sudo rm -rf /Applications/GarageBand.app /Applications/iMovie.app || true
          brew uninstall --force --ignore-dependencies $(brew list) 2>/dev/null || true
          brew cleanup --prune=all || true
          rm -rf ~/Library/Caches/* /tmp/* || true
          df -h /
      - name: Install xorriso (after disk cleanup)
        run: |
          brew install xorriso 2>&1 | tail -3
          xorrisofs --version 2>&1 | head -1
      - name: Download original parts and merge
        run: |
          BASE="https://github.com/Zjr0118/fastmac-1/releases/download/sonoma-latest"
          for i in aa ab ac ad ae af ag ah ai; do
            curl -L -s -o part-$i "$BASE/macos_sonoma.iso.part-$i"
          done
          cat part-* > macos_sonoma.iso
          rm -f part-*
          ls -lh macos_sonoma.iso
          ACTUAL=$(md5 -q macos_sonoma.iso)
          echo "MD5=$ACTUAL"
          if [ "$ACTUAL" != "820c8c54a1c14385ff6fc3acb37f47e1" ]; then
            echo "MD5 MISMATCH"
            exit 1
          fi
          echo "MD5 OK"
      - name: Attach original HFS+ volume (baseline)
        run: |
          MOUNT=$(hdiutil attach macos_sonoma.iso -readonly -nobrowse | awk -F'\t' '{print $NF}' | tail -1)
          echo "MOUNT=$MOUNT"
          echo "MOUNT=$MOUNT" >> $GITHUB_ENV
          echo "VOL is: $MOUNT"
      - name: Baseline stats (original HFS+)
        run: |
          echo "=== BASELINE HFS+ ($MOUNT) ==="
          echo "files:    $(find "$MOUNT" -type f | wc -l)"
          echo "symlinks: $(find "$MOUNT" -type l | wc -l)"
          echo "xattr_files: $(find "$MOUNT" -type f -print0 | xargs -0 -I{} xattr "{}" 2>/dev/null | grep -c . || true)"
          BIN=$(find "$MOUNT" -path "*.app/Contents/MacOS/*" -type f | head -1)
          echo "sample_bin=$BIN"
          xattr -l "$BIN" 2>/dev/null | head -8 || echo "(no xattr on binary)"
      - name: Build Rock Ridge ISO (xorrisofs -R -J)
        run: |
          df -h /
          xorrisofs \
            -R \
            -J \
            -volid "SonomaInstall" \
            -o macos_sonoma_rock.iso \
            "$MOUNT" 2>&1 | tail -5
          ls -lh macos_sonoma_rock.iso
          df -h /
      - name: Verify Rock Ridge ISO structure
        run: |
          RMOUNT=$(hdiutil attach macos_sonoma_rock.iso -readonly -nobrowse | awk -F'\t' '{print $NF}' | tail -1)
          echo "RMOUNT=$RMOUNT"
          echo "=== ROCK RIDGE ISO ==="
          echo "files:    $(find "$RMOUNT" -type f | wc -l)"
          echo "symlinks: $(find "$RMOUNT" -type l | wc -l)"
          echo "xattr_files: $(find "$RMOUNT" -type f -print0 | xargs -0 -I{} xattr "{}" 2>/dev/null | grep -c . || true)"
          echo "--- sample symlinks in ISO ---"
          find "$RMOUNT" -type l | head -5
          BIN2=$(find "$RMOUNT" -path "*.app/Contents/MacOS/*" -type f | head -1)
          echo "sample_bin2=$BIN2"
          xattr -l "$BIN2" 2>/dev/null | head -8 || echo "(no xattr on binary in ISO)"
          hdiutil detach "$RMOUNT" 2>/dev/null || true
      - name: Split and upload Rock Ridge ISO
        run: |
          hdiutil detach "$MOUNT" 2>/dev/null || true
          rm -f macos_sonoma.iso
          md5 macos_sonoma_rock.iso > md5_rock.txt
          split -b 1900m macos_sonoma_rock.iso macos_sonoma_rock.iso.part-
          rm -f macos_sonoma_rock.iso
          ls -lh macos_sonoma_rock.iso.part-* | tail -12
      - name: Upload to release sonoma-rockridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          UPLOAD="https://uploads.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token $GITHUB_TOKEN"
          OLD_ID=$(curl -s -H "$AUTH" "$API/releases/tags/sonoma-rockridge" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "" ]; then
            curl -s -X DELETE -H "$AUTH" "$API/releases/$OLD_ID"
            curl -s -X DELETE -H "$AUTH" "$API/git/refs/tags/sonoma-rockridge" || true
          fi
          python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))" << 'BODY' > /tmp/body.json
          macOS Sonoma 14.8.9 (23J631) Rock Ridge ISO（xorrisofs -R，保留符号链接与 POSIX 权限）

          ## 构建方式
          xorrisofs -R -J -volid SonomaInstall -o macos_sonoma_rock.iso <原始HFS+卷>
          -R 保留符号链接与 uid/gid（不用 -r，避免破坏 codesign）

          ## 使用（VMware Workstation）
          1. 光驱 SATA x2：1st=VMware-OpenCore.iso（引导），2nd=macos_sonoma_rock.iso（安装）
          2. 固件 UEFI、关安全启动、内存≥8GB、磁盘≥60GB
          3. 若报损坏：实用工具→终端→date 062000002024.00→exit→重新安装

          ## 合并
          Windows (CMD): copy /b macos_sonoma_rock.iso.part-* macos_sonoma_rock.iso
          Linux/macOS : cat macos_sonoma_rock.iso.part-* > macos_sonoma_rock.iso
          BODY
          RELEASE_ID=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"sonoma-rockridge\",\"name\":\"Sonoma ISO Rock Ridge\",\"prerelease\":true,\"body\":$(cat /tmp/body.json)}" \
            "$API/releases" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo "Release ID: $RELEASE_ID"
          for f in macos_sonoma_rock.iso.part-* md5_rock.txt; do
            echo "Uploading $f ..."
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --upload-file "$f" \
              "$UPLOAD/releases/$RELEASE_ID/assets?name=$(basename "$f")" -o /dev/null -w "  -> HTTP %{http_code}\n"
          done
      - name: Output download link
        run: |
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/sonoma-rockridge"
