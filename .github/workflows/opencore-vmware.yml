name: Build VMware OpenCore ISO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download base components (OpenCorePkg + KVM config)
        run: |
          curl -L -s -o /tmp/op.zip "https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.7/OpenCore-1.0.7-RELEASE.zip"
          mkdir -p /tmp/op
          unzip -q -o /tmp/op.zip -d /tmp/op
          curl -L -s -o /tmp/kvm.tar.gz "https://codeload.github.com/thenickdude/KVM-Opencore/tar.gz/refs/tags/v21"
          mkdir -p /tmp/kvm
          tar xzf /tmp/kvm.tar.gz -C /tmp/kvm
          KVM_DIR=$(find /tmp/kvm -maxdepth 1 -type d -name "KVM-Opencore*" | head -1)
          echo "KVM_DIR=$KVM_DIR"
          echo "KVM_DIR=$KVM_DIR" >> $GITHUB_ENV
          ls "$KVM_DIR/EFI/OC/"
      - name: Download kexts (latest official releases)
        run: |
          get_kext () {
            repo=$1
            zipname=$2
            tag=$(curl -s "https://api.github.com/repos/$repo/releases/latest" | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"])')
            echo "== $repo $tag =="
            curl -L -s -o /tmp/kext_$repo.zip "https://github.com/$repo/releases/download/$tag/$zipname"
            mkdir -p /tmp/kext_$repo
            unzip -q -o /tmp/kext_$repo.zip -d /tmp/kext_$repo
          }
          get_kext acidanthera/Lilu "Lilu-$tag-RELEASE.zip" || true
          get_kext acidanthera/WhateverGreen "WhateverGreen-$tag-RELEASE.zip" || true
          get_kext acidanthera/AppleALC "AppleALC-$tag-RELEASE.zip" || true
          get_kext acidanthera/BrcmPatchRAM "BrcmPatchRAM-$tag-RELEASE.zip" || true
          get_kext acidanthera/CryptexFixup "CryptexFixup-$tag-RELEASE.zip" || true
          ls /tmp/ | grep kext
      - name: Assemble EFI structure
        run: |
          mkdir -p oc_extract/EFI/OC
          # 1. OpenCorePkg 官方 EFI 骨架（OpenCore.efi + Drivers + Tools + Resources）
          cp -R /tmp/op/X64/EFI/OC/* oc_extract/EFI/OC/
          # 2. UEFI boot path
          mkdir -p oc_extract/EFI/BOOT
          cp /tmp/op/X64/EFI/BOOT/bootx64.efi oc_extract/EFI/BOOT/
          # 3. KVM config + ACPI + 内置 Kexts
          cp "$KVM_DIR/EFI/OC/config.plist" oc_extract/EFI/OC/
          cp -R "$KVM_DIR/EFI/OC/ACPI/"* oc_extract/EFI/OC/ACPI/
          cp -R "$KVM_DIR/EFI/OC/Kexts/"* oc_extract/EFI/OC/Kexts/
          # 4. config 引用的入口类驱动在 Tools 里，复制到 Drivers（KVM 原 ISO 即如此布局）
          for t in ResetNvramEntry ToggleSipEntry FirmwareSettingsEntry OpenShell; do
            if [ -f "/tmp/op/X64/EFI/OC/Tools/$t.efi" ]; then
              cp "/tmp/op/X64/EFI/OC/Tools/$t.efi" oc_extract/EFI/OC/Drivers/ || true
            fi
          done
          # 5. 官方 kext 解压后复制
          find /tmp/kext_* -name "*.kext" -maxdepth 3 2>/dev/null | while read k; do
            cp -R "$k" oc_extract/EFI/OC/Kexts/ 2>/dev/null || true
          done
          echo "--- OC content ---"
          ls oc_extract/EFI/OC/
          echo "--- Kexts ---"
          ls oc_extract/EFI/OC/Kexts/ | head -30
          echo "--- Drivers ---"
          ls oc_extract/EFI/OC/Drivers/ | head -40
      - name: Patch config.plist for VMware
        run: |
          CFG="oc_extract/EFI/OC/config.plist"
          python3 << 'PYEOF'
          import plistlib
          cfg_path = 'oc_extract/EFI/OC/config.plist'
          with open(cfg_path, 'rb') as f:
              cfg = plistlib.load(f)
          try:
              cfg['Kernel']['Quirks']['ProvideCurrentCpuInfo'] = True
              print('ProvideCurrentCpuInfo -> True OK')
          except Exception as e:
              print('Kernel/Quirks missing:', e)
          nvram_guid = '7C436110-AB2A-4BBB-A880-FE41995C9F82'
          try:
              args = cfg['NVRAM']['Add'].get(nvram_guid, {}).get('boot-args', '')
              if not isinstance(args, str):
                  args = ''
              if '-no_compat_check' not in args:
                  args = (args + ' -no_compat_check').strip()
              cfg['NVRAM']['Add'][nvram_guid]['boot-args'] = args
              print('boot-args ->', args)
          except Exception as e:
              print('NVRAM patch failed:', e)
          try:
              cfg['Misc']['Security']['SecureBootModel'] = 'Disabled'
              print('SecureBootModel -> Disabled OK')
          except Exception as e:
              print('Security patch failed:', e)
          try:
              cfg['Kernel']['Quirks']['AppleXcpmCfgLock'] = False
              print('AppleXcpmCfgLock -> False OK')
          except Exception as e:
              print('AppleXcpmCfgLock patch failed:', e)
          with open(cfg_path, 'wb') as f:
              plistlib.dump(cfg, f, fmt=plistlib.FMT_XML)
          print('config.plist saved')
          PYEOF
          /usr/libexec/PlistBuddy -c "Print :Kernel:Quirks:ProvideCurrentCpuInfo" "$CFG"
          /usr/libexec/PlistBuddy -c "Print :NVRAM:Add:7C436110-AB2A-4BBB-A880-FE41995C9F82:boot-args" "$CFG"
          /usr/libexec/PlistBuddy -c "Print :Misc:Security:SecureBootModel" "$CFG"
      - name: Build VMware OpenCore ISO
        run: |
          ls -la oc_extract/
          hdiutil makehybrid -iso -joliet -udf -default-volume-name "VMware OpenCore" \
            -o VMware-OpenCore.iso oc_extract
          ls -lh VMware-OpenCore.iso
      - name: Upload VMware OpenCore ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          UPLOAD="https://uploads.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token $GITHUB_TOKEN"
          OLD_ID=$(curl -s -H "$AUTH" "$API/releases/tags/opencore-vmware" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "" ]; then
            curl -s -X DELETE -H "$AUTH" "$API/releases/$OLD_ID"
            curl -s -X DELETE -H "$AUTH" "$API/git/refs/tags/opencore-vmware" || true
          fi
          python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))" << 'BODY' > /tmp/body.json
          VMware Workstation 专用 OpenCore 引导盘（基于 KVM-Opencore v21 配置 + OpenCorePkg 1.0.7 官方组件）

          ## 修改内容
          - ProvideCurrentCpuInfo = true（VMware 虚拟 CPU 需要）
          - boot-args 追加 -no_compat_check（跳过机型兼容检查）
          - SecureBootModel = Disabled
          - AppleXcpmCfgLock = false

          ## 使用（配合标准版安装镜像）
          1. VMware Workstation 虚拟机设置中，把两个光驱都改为 SATA 接口
          2. 1st 光驱挂载本 OpenCore ISO（引导）
          3. 2nd 光驱挂载 macos_sonoma_standard.iso（标准版安装镜像，从 sonoma-standard release 下载）
          4. 固件 UEFI，关闭安全启动，内存≥8GB，磁盘≥60GB
          5. OpenCore 菜单出现后选择 macOS installer
          BODY
          RELEASE_ID=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"opencore-vmware\",\"name\":\"OpenCore VMware Tuned\",\"prerelease\":true,\"body\":$(cat /tmp/body.json)}" \
            "$API/releases" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo "Release ID: $RELEASE_ID"
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
            --upload-file VMware-OpenCore.iso \
            "$UPLOAD/releases/$RELEASE_ID/assets?name=VMware-OpenCore.iso" -o /dev/null -w "OpenCore -> HTTP %{http_code}\n"
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/opencore-vmware"
