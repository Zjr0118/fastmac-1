name: Verify UDF codesign
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /Applications/Xcode.app || true
          sudo rm -rf /Library/Developer/CommandLineTools || true
          brew uninstall --force --ignore-dependencies $(brew list) 2>/dev/null || true
          brew cleanup --prune=all || true
          rm -rf ~/Library/Caches/* /tmp/* || true
          df -h /
      - name: Download UDF parts and merge
        run: |
          BASE="https://github.com/Zjr0118/fastmac-1/releases/download/sonoma-udf"
          for i in aa ab ac ad ae af ag ah; do
            curl -L -s -o upart-$i "$BASE/macos_sonoma_udf.iso.part-$i"
          done
          cat upart-* > macos_sonoma_udf.iso
          rm -f upart-*
          ls -lh macos_sonoma_udf.iso
      - name: Attach UDF ISO
        run: |
          UMOUNT=$(hdiutil attach macos_sonoma_udf.iso -readonly -nobrowse | awk -F'\t' '{print $NF}' | tail -1)
          echo "UMOUNT=$UMOUNT"
          echo "UMOUNT=$UMOUNT" >> $GITHUB_ENV
          ls "$UMOUNT"
      - name: CODESIGN verify (ultimate test)
        run: |
          APP="$UMOUNT/Install macOS Sonoma.app"
          echo "=== codesign verify ==="
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | head -30
          echo "exit: $?"
          echo "=== designated requirement ==="
          codesign -d --requirements - "$APP" 2>&1 | head -5
          echo "=== spctl assessment ==="
          spctl -a -vv --type exec "$APP/Contents/MacOS/InstallAssistant" 2>&1 | head -5 || true
      - name: Compare file lists (baseline 948 vs UDF)
        run: |
          # 统计 .app 内文件与软链接
          APP="$UMOUNT/Install macOS Sonoma.app"
          echo "app files:    $(find "$APP" -type f | wc -l)"
          echo "app symlinks: $(find "$APP" -type l | wc -l)"
          echo "--- 关键：SharedSupport.dmg 大小 ---"
          ls -lh "$APP/Contents/SharedSupport/SharedSupport.dmg" 2>/dev/null || ls -lh "$UMOUNT/Install macOS Sonoma.app/Contents/SharedSupport/" 2>/dev/null
      - name: Conclusion
        run: |
          APP="$UMOUNT/Install macOS Sonoma.app"
          if codesign --verify --deep --strict "$APP" >/dev/null 2>&1; then
            echo "CODESIGN_RESULT=PASS"
          else
            echo "CODESIGN_RESULT=FAIL"
          fi
